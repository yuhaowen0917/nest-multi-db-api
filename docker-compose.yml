services:
  # =====================
  # NestJS 应用服务
  # =====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-test-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # MySQL 连接（宿主机本地运行的 MySQL）
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-123456}
      - DB_NAME=${DB_NAME:-blog}
      # PostgreSQL 连接（宿主机本地运行的 PostgreSQL）
      - PG_HOST=host.docker.internal
      - PG_PORT=5432
      - PG_USER=${PG_USER:-postgres}
      - PG_PASS=${PG_PASS:-123456}
      - PG_DB=${PG_DB:-pg_sequelize_db}
      # JWT
      - JWT_SECRET=${JWT_SECRET:-nest_jwt_secret_666}
      - JWT_EXPIRES_IN=7d
      # WebSocket CORS
      - WS_ORIGIN=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
